<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BACCARDI - Panel de Administrador</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- PANTALLA DE LOGIN (USUARIO Y CONTRASEÑA REALES) -->
  <div id="adminLogin" class="admin-bloqueado">
    <i class="fas fa-lock" style="font-size: 2.5rem; color: var(--accent-gold); margin-bottom: 15px;"></i>
    <h2>Panel de Administrador</h2>
    <p style="margin-bottom: 20px;">Inicia sesión para continuar.</p>

    <form id="loginForm" style="width: 100%; max-width: 320px;">
      <div class="form-group">
        <label for="loginEmail">Correo:</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="admin@baccardi.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Contraseña:</label>
        <input type="password" id="loginPassword" class="form-control" required>
      </div>
      <p id="loginError" style="color: var(--accent-red); font-size: 0.85rem; display: none; margin-bottom: 10px;"></p>
      <button type="submit" class="btn-submit" id="btnLoginSubmit">Ingresar</button>
    </form>
  </div>

  <!-- CONTENIDO DEL PANEL (OCULTO HASTA INICIAR SESIÓN) -->
  <div id="adminApp" style="display: none;">

    <header>
      <div class="logo-container">
        <i class="fas fa-hamburger" style="color: var(--accent-gold); font-size: 1.8rem;"></i>
        <h1 class="logo-title">BACCARDI · Admin</h1>
      </div>
      <div class="header-actions">
        <a href="menu.html" class="btn-icon" title="Ver la carta como cliente">
          <i class="fas fa-eye"></i>
        </a>
        <button class="btn-icon" id="btnLogout" title="Cerrar sesión">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>

    <main>
      <!-- FORMULARIO: AGREGAR PRODUCTO NUEVO -->
      <div class="admin-section">
        <h2 class="admin-section-title"><i class="fas fa-plus-circle"></i> Agregar Nuevo Producto</h2>

        <form id="addProductForm">
          <div class="form-group">
            <label for="prodName">Nombre del plato:</label>
            <input type="text" id="prodName" class="form-control" placeholder="Ej: Hamburguesa Baccardi" required>
          </div>

          <div class="form-group">
            <label for="prodCategory">Categoría:</label>
            <select id="prodCategory" class="form-control" required>
              <option value="hamburguesas">Hamburguesas</option>
              <option value="doggies">Doggies / Perros</option>
              <option value="papas">Papas / Entradas</option>
              <option value="bebidas">Bebidas</option>
            </select>
          </div>

          <div class="form-group">
            <label for="prodPrice">Precio ($):</label>
            <input type="number" id="prodPrice" class="form-control" placeholder="Ej: 25000" required>
          </div>

          <div class="form-group">
            <label for="prodDesc">Descripción / Ingredientes:</label>
            <textarea id="prodDesc" class="form-control" rows="3" placeholder="Ej: Doble carne, queso cheddar, tocineta..." required></textarea>
          </div>

          <div class="form-group">
            <label>Imagen del producto:</label>
            <div style="display: flex; gap: 15px; margin-bottom: 10px;">
              <label><input type="radio" name="imgSource" value="url" checked> URL de Internet</label>
              <label><input type="radio" name="imgSource" value="file"> Archivo Local (se optimiza automáticamente)</label>
            </div>
            <input type="url" id="prodImgUrl" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
            <input type="file" id="prodImgFile" class="form-control" accept="image/*" style="display: none;">
          </div>

          <button type="submit" class="btn-submit">Guardar Producto</button>
        </form>
      </div>

      <!-- LISTA DE PRODUCTOS ACTUALES -->
      <div class="admin-section">
        <h2 class="admin-section-title"><i class="fas fa-list"></i> Productos Actuales</h2>
        <div id="adminProductList" class="admin-product-list">
          <p style="color: var(--text-muted);">Cargando productos...</p>
        </div>
      </div>
    </main>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
